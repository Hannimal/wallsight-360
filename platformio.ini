; Radar360 ESP32-S3 N8R8 (8 MB QIO flash, 8 MB OPI PSRAM)
; PlatformIO firmware: pio run, pio run -t upload, pio device monitor
[platformio]
default_envs = esp32s3-n8r8

[env:esp32s3-n8r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Select ESP32-S3-WROOM-1 N8R8 memory layout (not N8 without PSRAM)
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341
    adafruit/Adafruit BusIO
