name: CI

on:
  push:
  pull_request:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test LiDAR/mmWave protocols
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic tests/protocol_tests.cpp -o /tmp/protocol_tests
          /tmp/protocol_tests
      - name: Test mapping and persistence
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -Werror -pedantic tests/map_tests.cpp -o /tmp/map_tests
          /tmp/map_tests
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pio run -e esp32s3-n8r8
