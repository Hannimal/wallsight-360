<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 1440 770"><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07151c"/><stop offset=".55" stop-color="#102936"/><stop offset="1" stop-color="#174454"/></linearGradient>
<linearGradient id="line" x2="1"><stop stop-color="#60dacd"/><stop offset="1" stop-color="#a0f6b4"/></linearGradient>
<filter id="shade" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".3"/></filter>
</defs>
<rect width="1440" height="770" fill="url(#bg)"/>
<text x="72" y="87" font-family="Arial,sans-serif" font-size="50" font-weight="700" fill="#f1fafb">How WallSight 360 works</text>
<text x="73" y="129" font-family="Arial,sans-serif" font-size="23" fill="#accad2">Two sensor streams, one stable map, live targets on a compact display</text>
<g><rect x="70" y="214" width="304" height="133" rx="20" fill="#153543" stroke="#346270" stroke-width="2"/><rect x="90" y="239" width="5" height="83" rx="2" fill="#83e8dc"/><text x="115" y="267" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#e7f7fa">LD19  ·  LiDAR</text><text x="115" y="303" font-family="Arial,sans-serif" font-size="19" fill="#b3d0d7">360° distances at 230400 baud</text></g>
<g><rect x="70" y="436" width="304" height="133" rx="20" fill="#153543" stroke="#346270" stroke-width="2"/><rect x="90" y="461" width="5" height="83" rx="2" fill="#ffb57c"/><text x="115" y="489" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#e7f7fa">LD2450  ·  mmWave</text><text x="115" y="525" font-family="Arial,sans-serif" font-size="19" fill="#b3d0d7">3 frontal targets at 256000 baud</text></g>
<path d="M374 280 H455 M374 502 H455 M935 280 H1020 M935 502 H1020" stroke="#7edfd7" fill="none" stroke-width="4" stroke-linecap="round"/>
<g fill="#7edfd7"><path d="M456 272 l16 8 -16 8z"/><path d="M456 494 l16 8 -16 8z"/><path d="M1020 272 l16 8 -16 8z"/><path d="M1020 494 l16 8 -16 8z"/></g>
<rect x="475" y="193" width="458" height="419" rx="25" fill="#132d3b" stroke="#386373" stroke-width="2.5"/>
<text x="515" y="241" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#eefbfb">ESP32-S3 processing</text>
<g><rect x="510" y="267" width="390" height="68" rx="12" fill="#0c222e"/><text x="532" y="294" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#b9f0e8">01  SERIAL DECODE</text><text x="532" y="319" font-family="Arial,sans-serif" font-size="17" fill="#acc8d1">LD19 CRC checks + LD2450 target frames</text></g><g><rect x="510" y="348" width="390" height="68" rx="12" fill="#0c222e"/><text x="532" y="375" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#b9f0e8">02  STABILIZE</text><text x="532" y="400" font-family="Arial,sans-serif" font-size="17" fill="#acc8d1">360 angular bins with temporal filtering</text></g><g><rect x="510" y="429" width="390" height="68" rx="12" fill="#0c222e"/><text x="532" y="456" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#b9f0e8">03  EXTRACT</text><text x="532" y="481" font-family="Arial,sans-serif" font-size="17" fill="#acc8d1">Straight segments from persistent points</text></g><g><rect x="510" y="510" width="390" height="68" rx="12" fill="#0c222e"/><text x="532" y="537" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#b9f0e8">04  DISPLAY / STORE</text><text x="532" y="562" font-family="Arial,sans-serif" font-size="17" fill="#acc8d1">ILI9341 overlay + flash/NVS save</text></g>
<g><rect x="1040" y="214" width="332" height="133" rx="20" fill="#153543" stroke="#346270" stroke-width="2"/><rect x="1060" y="239" width="5" height="83" rx="2" fill="#83e8dc"/><text x="1085" y="267" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#e7f7fa">Flash / NVS</text><text x="1085" y="303" font-family="Arial,sans-serif" font-size="19" fill="#b3d0d7">Stored room surface map</text></g>
<g><rect x="1040" y="436" width="332" height="133" rx="20" fill="#153543" stroke="#346270" stroke-width="2"/><rect x="1060" y="461" width="5" height="83" rx="2" fill="#83e8dc"/><text x="1085" y="489" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#e7f7fa">ILI9341  ·  TFT</text><text x="1085" y="525" font-family="Arial,sans-serif" font-size="19" fill="#b3d0d7">Wall segments and people</text></g>
<text x="76" y="677" font-family="Arial,sans-serif" font-size="20" fill="#a9c7cf">SCAN: accumulate stable surfaces → save map → LIVE: keep geometry and overlay mmWave targets.</text>
<text x="76" y="711" font-family="Arial,sans-serif" font-size="19" fill="#86afa9">Stationary 2D scan; not SLAM or architectural wall identification.</text>
</svg>